function showToast(msg, isError = false, duration = 3500) {
  const stack = document.getElementById('toast-stack')
  if (!stack) return
  const el = document.createElement('div')
  el.className = 'toast-item ' + (isError ? 'toast-error' : 'toast-success')
  el.textContent = msg
  stack.prepend(el)
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')))
  setTimeout(() => {
    el.classList.remove('show')
    setTimeout(() => el.remove(), 350)
  }, duration)
}

function timeAgo(iso) {
  const d = new Date(iso)
  return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
}

function formatAbsoluteTime(iso) {
  const d = new Date(iso)
  return d.toLocaleString('zh-CN', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  })
}

function formatRelativeTime(iso) {
  if (!iso) return ''
  const diffSec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000))
  if (diffSec < 10) return '刚刚'
  if (diffSec < 60) return `${diffSec} 秒前`
  const diffMin = Math.floor(diffSec / 60)
  if (diffMin < 60) return `${diffMin} 分钟前`
  const diffHour = Math.floor(diffMin / 60)
  if (diffHour < 24) return `${diffHour} 小时前`
  const diffDay = Math.floor(diffHour / 24)
  if (diffDay < 30) return `${diffDay} 天前`
  const diffMonth = Math.floor(diffDay / 30)
  if (diffMonth < 12) return `${diffMonth} 个月前`
  return `${Math.floor(diffMonth / 12)} 年前`
}

function statusIcon(status, conclusion) {
  if (status === 'in_progress' || status === 'queued')
    return '<span class="run-dot run-dot-running"></span>'
  if (conclusion === 'success')
    return '<span class="run-dot run-dot-success"></span>'
  if (conclusion === 'failure')
    return '<span class="run-dot run-dot-failure"></span>'
  if (conclusion === 'cancelled')
    return '<span class="run-dot run-dot-cancelled"></span>'
  return '<span class="run-dot run-dot-unknown"></span>'
}

function dotClass(status, conclusion) {
  if (status === 'in_progress' || status === 'queued') return 'dot-running'
  if (conclusion === 'success') return 'dot-success'
  if (conclusion === 'failure') return 'dot-failure'
  return 'dot-unknown'
}

function badgeLabel(status, conclusion) {
  if (status === 'in_progress') return '部署中'
  if (status === 'queued') return '排队中'
  if (conclusion === 'success') return '成功'
  if (conclusion === 'failure') return '失败'
  if (conclusion === 'cancelled') return '已取消'
  return '未知'
}

function isRunning(runs) {
  return runs.length > 0 && (runs[0].status === 'in_progress' || runs[0].status === 'queued')
}

function isFailureLikeConclusion(c) {
  return c === 'failure' || c === 'cancelled' || c === 'timed_out'
}

function getRunSeverity(run) {
  if (!run) return 3
  if (isFailureLikeConclusion(run.conclusion)) return 0
  if (run.status === 'in_progress' || run.status === 'queued') return 1
  if (run.conclusion === 'success') return 2
  return 3
}

function getRunInitiator(run) {
  return run?.triggering_actor?.login || run?.actor?.login || '-'
}

function getVisibleRuns(cardId, runs) {
  if (RUN_HISTORY_EXPANDED[cardId] || isRunning(runs)) return runs.slice(0, 3)
  return runs.slice(0, 1)
}

function getLatestRunTimestamp(runs) {
  const latest = runs?.[0]?.created_at
  return latest ? new Date(latest).getTime() : 0
}

function getLatestDeployTime(run) {
  return run?.run_started_at || run?.created_at || ''
}

function getRunBranch(run) {
  return run?.head_branch || run?.head_sha?.slice(0, 7) || ''
}

function normalizeEnvValue(value) {
  const raw = String(value || '').trim().toLowerCase()
  if (!raw) return ''
  if (raw.includes('prod')) return 'prod'
  if (raw.includes('test')) return 'test'
  return ''
}

function getDefaultEnv(wf) {
  for (const [, cfg] of Object.entries(wf.inputs || {})) {
    if (!cfg.envKey) continue
    return normalizeEnvValue(cfg.default) || normalizeEnvValue(globalEnv) || 'test'
  }
  return normalizeEnvValue(globalEnv) || 'test'
}

function getConfiguredEnv(wf, cardId) {
  for (const [key, cfg] of Object.entries(wf.inputs || {})) {
    if (!cfg.envKey) continue
    const el = typeof document !== 'undefined' ? document.getElementById(`${cardId}-${key}`) : null
    return normalizeEnvValue(el?.value) || getDefaultEnv(wf)
  }
  return getDefaultEnv(wf)
}

function getRunEnvironment(run, wf, cardId) {
  const inputMeta = RUN_INPUTS?.[run?.id] || null
  const labels = inputMeta?.labels || []
  for (const label of labels) {
    const env = normalizeEnvValue(label)
    if (env) return env
  }

  const runnerEnv = normalizeEnvValue(inputMeta?.runner_name)
  if (runnerEnv) return runnerEnv

  const titleEnv = normalizeEnvValue(run?.display_title) || normalizeEnvValue(run?.name)
  if (titleEnv) return titleEnv

  if (run?.status === 'in_progress' || run?.status === 'queued') {
    return getConfiguredEnv(wf, cardId)
  }
  return getDefaultEnv(wf)
}

function resolveCardEnv(wf, cardId) {
  return getConfiguredEnv(wf, cardId)
}

function renderEnvBadge(wf, cardId) {
  return ''
}

function getCardInputValues(wf, cardId) {
  const values = {}
  for (const [key, cfg] of Object.entries(wf.inputs || {})) {
    const el = typeof document !== 'undefined' ? document.getElementById(`${cardId}-${key}`) : null
    values[key] = el?.value || cfg.default || ''
  }
  return values
}

function renderInputSummary(wf, cardId) {
  const values = getCardInputValues(wf, cardId)
  const branch = values.ref || values.branch || 'main'
  return `分支 <b>${branch || '-'}</b>`
}

function renderStatusTextBadge(latest) {
  if (!latest) return ''
  const label = badgeLabel(latest.status, latest.conclusion)
  let cls = ''
  if (latest.status === 'in_progress' || latest.status === 'queued') cls = ' is-running'
  else if (isFailureLikeConclusion(latest.conclusion)) cls = ' is-fail'
  else if (latest.conclusion === 'success') cls = ' is-success'
  return `<span class="status-text-badge${cls}">${label}</span>`
}

function getHistoryToggleTitle(cardId, deployAt, running) {
  const action = RUN_HISTORY_EXPANDED[cardId] ? '点击收起历史' : '点击查看历史'
  const prefix = running ? `开始于 ${formatAbsoluteTime(deployAt)}` : `最后部署：${formatAbsoluteTime(deployAt)}`
  return `${prefix} · ${action}`
}

function renderCardTimeMeta(cardId, latest, running) {
  if (!latest) return ''
  const deployAt = getLatestDeployTime(latest)
  if (!deployAt) return ''
  const title = getHistoryToggleTitle(cardId, deployAt, running)
  if (running) {
    return `<button type="button" class="card-time-trigger" onclick="toggleRunHistory('${cardId}')" title="${title}" aria-expanded="${!!RUN_HISTORY_EXPANDED[cardId]}"><span class="elapsed-badge" id="elapsed-${cardId}">进行中 0m 0s</span></button>`
  }
  const relative = formatRelativeTime(deployAt)
  const stateCls = isFailureLikeConclusion(latest.conclusion) ? ' is-fail' : (latest.conclusion === 'success' ? ' is-success' : '')
  return `<button type="button" class="card-time-trigger" onclick="toggleRunHistory('${cardId}')" title="${title}" aria-expanded="${!!RUN_HISTORY_EXPANDED[cardId]}"><span class="last-deploy-pill${stateCls}" id="lastdeploy-${cardId}" data-relative-time="${deployAt}">最后部署 ${relative}</span></button>`
}

function getRecentFailureRun(runs) {
  if (!Array.isArray(runs) || runs.length < 2) return null
  return runs.slice(1).find(run => isFailureLikeConclusion(run.conclusion)) || null
}

function getRunsForList(runs) {
  if (!Array.isArray(runs) || runs.length === 0) return []
  const latest = runs[0]
  const featuredFailure = latest && !isFailureLikeConclusion(latest.conclusion)
    ? getRecentFailureRun(runs)
    : null
  return runs.filter((run, index) => index !== 0 && run !== featuredFailure).slice(0, 5)
}

function renderFailureSummary(runs) {
  const latest = Array.isArray(runs) ? runs[0] : null
  if (!latest || isFailureLikeConclusion(latest.conclusion)) return ''
  const failureRun = getRecentFailureRun(runs)
  if (!failureRun) return ''
  const summary = failureRun.display_title || failureRun.name || failureRun.conclusion || '最近一次部署失败'
  const deployAt = getLatestDeployTime(failureRun)
  const meta = `${badgeLabel(failureRun.status, failureRun.conclusion)} · ${deployAt ? formatRelativeTime(deployAt) : '刚刚'}`
  const logLink = failureRun.html_url
    ? `<a class="run-link card-alert-link" href="${failureRun.html_url}" target="_blank" rel="noopener noreferrer">查看</a>`
    : ''
  return `<div class="card-alert-summary" title="${summary}">
    <strong>最近失败</strong>
    <div class="card-alert-copy">
      <span>${summary}</span>
      <small>${meta}</small>
    </div>
    ${logLink}
  </div>`
}

function renderExecutionSummary(latest, wf, cardId) {
  if (!latest) return ''
  const deployAt = getLatestDeployTime(latest)
  const actor = getRunInitiator(latest)
  const branch = getRunBranch(latest)
  const env = getRunEnvironment(latest, wf, cardId)
  const envBadge = env ? `<span class="execution-chip execution-env-chip run-env-badge run-input-${env}">${env.toUpperCase()}</span>` : ''
  const status = renderStatusTextBadge(latest)
  const timeText = deployAt ? formatAbsoluteTime(deployAt) : '未知时间'
  const title = latest.display_title || latest.name || `${wf.label} 最近执行`
  const logLink = latest.html_url
    ? `<a class="run-link execution-summary-link" href="${latest.html_url}" target="_blank" rel="noopener noreferrer">查看</a>`
    : ''
  return `<div class="execution-summary">
    <div class="execution-summary-top">
      <div class="execution-summary-title" title="${title}">${title}</div>
      <div class="execution-summary-actions">${status}${logLink}</div>
    </div>
    <div class="execution-summary-meta">
      ${branch ? `<span class="execution-chip">分支 · ${branch}</span>` : ''}
      ${envBadge}
      <span class="execution-chip execution-meta-block">触发人 · ${actor}</span>
      <span class="execution-chip execution-meta-block execution-time-chip">执行于 · ${timeText}</span>
    </div>
  </div>`
}

function getAttentionServices() {
  const fail = []
  const running = []
  Object.entries(WF_MAP).forEach(([cardId, wf]) => {
    if (wf.disabled) return
    const runs = CARD_RUNS[cardId] || []
    const latest = runs[0]
    if (!latest) return
    if (isFailureLikeConclusion(latest.conclusion)) fail.push(wf.label)
    else if (isRunning(runs)) running.push(wf.label)
  })
  return { fail, running }
}

function renderHeroAlert(metrics) {
  if (metrics.fail <= 0 && metrics.running <= 0) return ''
  const isFail = metrics.fail > 0
  const services = getAttentionServices()
  const title = isFail ? '需要立即处理的部署异常' : '当前有服务正在部署'
  let text = ''
  if (metrics.fail > 0 && metrics.running > 0) {
    text = `失败：${services.fail.slice(0, 2).join('、')}${services.fail.length > 2 ? ` 等 ${services.fail.length} 个` : ''}；部署中：${services.running.slice(0, 2).join('、')}${services.running.length > 2 ? ` 等 ${services.running.length} 个` : ''}。`
  } else if (metrics.fail > 0) {
    text = `失败服务：${services.fail.slice(0, 3).join('、')}${services.fail.length > 3 ? ` 等 ${services.fail.length} 个` : ''}。`
  } else {
    text = `部署中：${services.running.slice(0, 3).join('、')}${services.running.length > 3 ? ` 等 ${services.running.length} 个` : ''}。`
  }
  return `<div class="hero-alert ${isFail ? 'is-fail' : ''} show" id="hero-alert">
    <div class="hero-alert-copy">
      <div class="hero-alert-title">${title}</div>
      <div class="hero-alert-text">${text}</div>
    </div>
    <button class="hero-alert-action" onclick="filterByStatus('attention')">查看异常</button>
  </div>`
}

function getFilterBannerCopy() {
  if (!activeFilter) return null
  if (activeFilter === 'attention') return { title: '当前仅显示异常服务', text: '页面已聚焦失败或正在部署的服务，便于快速处理异常。' }
  if (activeFilter === 'fail') return { title: '当前仅显示失败服务', text: '适合集中处理最近失败的卡片。' }
  if (activeFilter === 'running') return { title: '当前仅显示部署中服务', text: '适合盯住正在执行的任务和观察结果回流。' }
  if (activeFilter === 'ok') return { title: '当前仅显示正常服务', text: '适合快速核对当前稳定服务状态。' }
  return { title: '当前已启用筛选', text: '页面仅展示当前筛选条件下的卡片。' }
}

function renderActiveFilterBanner() {
  const copy = getFilterBannerCopy()
  if (!copy) return ''
  return `<div class="filter-banner">
    <div class="filter-banner-copy">
      <div class="filter-banner-title">${copy.title}</div>
      <div class="filter-banner-text">${copy.text}</div>
    </div>
    <button class="filter-banner-action" onclick="clearStatusFilter()">清除筛选</button>
  </div>`
}

function updateFilterBanner() {
  const slot = document.getElementById('filter-banner-slot')
  if (slot) slot.innerHTML = renderActiveFilterBanner()
}

function computeSectionMetrics(entries) {
  const metrics = { total: 0, fail: 0, running: 0, ok: 0, latestAt: 0 }
  entries.forEach(({ wf, runs }) => {
    if (wf.disabled) return
    metrics.total++
    const latest = runs[0]
    if (!latest) return
    if (isFailureLikeConclusion(latest.conclusion)) metrics.fail++
    else if (isRunning(runs)) metrics.running++
    else if (latest.conclusion === 'success') metrics.ok++
    metrics.latestAt = Math.max(metrics.latestAt, getLatestRunTimestamp(runs))
  })
  return metrics
}

function renderSectionHeader(gridId, labelClass, labelText, entries) {
  const metrics = computeSectionMetrics(entries)
  const latestText = metrics.latestAt ? formatRelativeTime(new Date(metrics.latestAt).toISOString()) : '暂无记录'
  const collapsed = !!SECTION_COLLAPSED[gridId]
  const hasCustomSort = hasCustomSectionSort(gridId)
  return `
    <div class="section-label-main">
      ${getSectionLabelIcon(labelClass, labelText)}
      <div class="section-label-copy">
        <div class="section-title-row">
          <span class="section-title-badge">${labelText}</span>
          <div class="section-subtitle">${metrics.total} 个服务 · ${metrics.ok} 正常 · ${metrics.fail} 失败 · ${metrics.running} 运行中</div>
        </div>
      </div>
    </div>
    <div class="section-metrics">
      <span class="section-pill ${metrics.fail > 0 ? 'fail' : ''}">失败 ${metrics.fail}</span>
      <span class="section-pill ${metrics.running > 0 ? 'running' : ''}">运行中 ${metrics.running}</span>
      <span class="section-pill time">最近更新 ${latestText}</span>
      <div class="section-actions">
        <button class="section-action-btn" onclick="clearSectionSort('${gridId}')" ${hasCustomSort ? '' : 'disabled'}>恢复默认排序</button>
        <button class="section-action-btn" onclick="refreshSection('${gridId}')">刷新本组</button>
        <button class="section-action-btn attention" onclick="triggerSectionAttentionDeploy('${gridId}')">部署异常项</button>
        <button class="section-toggle" onclick="toggleSection('${gridId}')">${collapsed ? '展开分组' : '收起分组'}</button>
      </div>
    </div>
  `
}

function getWorkflowSortKey(wf) {
  return [wf.owner, wf.repo, wf.workflow, wf.label].join('::')
}

function getDefaultEntryOrder(left, right) {
  return left.index - right.index
}

function hasCustomSectionSort(gridId) {
  return Array.isArray(SECTION_CUSTOM_SORTS[gridId]) && SECTION_CUSTOM_SORTS[gridId].length > 0
}

function applySectionCustomSort(gridId, items, getItemKey, fallbackCompare = getDefaultEntryOrder) {
  const customOrder = SECTION_CUSTOM_SORTS[gridId]
  if (!Array.isArray(customOrder) || !customOrder.length) return [...items]
  const orderMap = new Map(customOrder.map((key, index) => [key, index]))
  return [...items].sort((left, right) => {
    const leftOrder = orderMap.has(getItemKey(left)) ? orderMap.get(getItemKey(left)) : Number.MAX_SAFE_INTEGER
    const rightOrder = orderMap.has(getItemKey(right)) ? orderMap.get(getItemKey(right)) : Number.MAX_SAFE_INTEGER
    if (leftOrder !== rightOrder) return leftOrder - rightOrder
    return fallbackCompare(left, right)
  })
}

function sortWorkflowEntries(entries, gridId) {
  const defaultEntries = [...entries].sort(getDefaultEntryOrder)
  return applySectionCustomSort(gridId, defaultEntries, item => getWorkflowSortKey(item.wf))
}

function deriveGridId(cardId) {
  return cardId.replace(/-\d+$/, '')
}

function reorderSectionCards(gridId) {
  const section = document.getElementById(`section-${gridId}`)
  if (!section) return
  const cards = [...section.querySelectorAll('.card[data-card-id]')]
  const orderedCards = hasCustomSectionSort(gridId)
    ? applySectionCustomSort(
        gridId,
        cards,
        card => card.dataset.sortKey || '',
        (left, right) => parseInt(left.dataset.cardId.split('-').pop(), 10) - parseInt(right.dataset.cardId.split('-').pop(), 10)
      )
    : [...cards].sort((a, b) => parseInt(a.dataset.cardId.split('-').pop(), 10) - parseInt(b.dataset.cardId.split('-').pop(), 10))
  orderedCards.forEach(card => section.appendChild(card))
}

function persistSectionSort(gridId) {
  const section = document.getElementById(`section-${gridId}`)
  if (!section) return
  const sortKeys = [...section.querySelectorAll('.card[data-card-id]')]
    .map(card => card.dataset.sortKey)
    .filter(Boolean)
  if (!sortKeys.length) return
  SECTION_CUSTOM_SORTS[gridId] = sortKeys
  saveSectionCustomSorts()
  updateSectionHeader(gridId)
}

function clearSectionDragState(gridId = null) {
  const selector = gridId ? `#section-${gridId} .card.is-drop-target` : '.card.is-drop-target'
  document.querySelectorAll(selector).forEach(card => card.classList.remove('is-drop-target'))
}

function handleCardDragStart(event, gridId, cardId) {
  if (activeFilter) {
    event.preventDefault()
    showToast('请先清除筛选后再拖动排序', true)
    return
  }
  DRAG_STATE.gridId = gridId
  DRAG_STATE.cardId = cardId
  event.dataTransfer.effectAllowed = 'move'
  event.dataTransfer.setData('text/plain', cardId)
  requestAnimationFrame(() => {
    document.getElementById(`card-${cardId}`)?.classList.add('is-dragging')
  })
}

function handleCardDragEnd(gridId, cardId) {
  document.getElementById(`card-${cardId}`)?.classList.remove('is-dragging')
  clearSectionDragState(gridId)
  DRAG_STATE.gridId = null
  DRAG_STATE.cardId = null
}

function handleCardDragOver(event, gridId, targetCardId) {
  if (!DRAG_STATE.cardId || DRAG_STATE.gridId !== gridId || DRAG_STATE.cardId === targetCardId) return
  event.preventDefault()
  event.dataTransfer.dropEffect = 'move'
  clearSectionDragState(gridId)
  document.getElementById(`card-${targetCardId}`)?.classList.add('is-drop-target')
}

function handleCardDragLeave(event, gridId, targetCardId) {
  const target = document.getElementById(`card-${targetCardId}`)
  if (!target || target.contains(event.relatedTarget)) return
  target.classList.remove('is-drop-target')
}

function handleCardDrop(event, gridId, targetCardId) {
  if (!DRAG_STATE.cardId || DRAG_STATE.gridId !== gridId || DRAG_STATE.cardId === targetCardId) return
  event.preventDefault()
  event.stopPropagation()
  const section = document.getElementById(`section-${gridId}`)
  const draggedCard = document.getElementById(`card-${DRAG_STATE.cardId}`)
  const targetCard = document.getElementById(`card-${targetCardId}`)
  if (!section || !draggedCard || !targetCard) return
  section.insertBefore(draggedCard, targetCard)
  clearSectionDragState(gridId)
  persistSectionSort(gridId)
}

function handleSectionDragOver(event, gridId) {
  if (!DRAG_STATE.cardId || DRAG_STATE.gridId !== gridId) return
  if (event.target.closest('.card[data-card-id]')) return
  event.preventDefault()
  event.dataTransfer.dropEffect = 'move'
  clearSectionDragState(gridId)
}

function handleSectionDrop(event, gridId) {
  if (!DRAG_STATE.cardId || DRAG_STATE.gridId !== gridId) return
  if (event.target.closest('.card[data-card-id]')) return
  event.preventDefault()
  const section = document.getElementById(`section-${gridId}`)
  const draggedCard = document.getElementById(`card-${DRAG_STATE.cardId}`)
  if (!section || !draggedCard) return
  section.appendChild(draggedCard)
  clearSectionDragState(gridId)
  persistSectionSort(gridId)
}

function clearSectionSort(gridId) {
  if (!hasCustomSectionSort(gridId)) return
  delete SECTION_CUSTOM_SORTS[gridId]
  saveSectionCustomSorts()
  reorderSectionCards(gridId)
  updateSectionHeader(gridId)
  showToast('已恢复默认排序')
}

function cardMatchesFilter(cardId) {
  if (!activeFilter) return true
  const runs = CARD_RUNS[cardId] || []
  const latest = runs[0]
  if (activeFilter === 'attention') return isRunning(runs) || (!!latest && isFailureLikeConclusion(latest.conclusion))
  if (activeFilter === 'ok') return latest?.conclusion === 'success' && latest?.status !== 'in_progress'
  if (activeFilter === 'running') return isRunning(runs)
  if (activeFilter === 'fail') return !!latest && isFailureLikeConclusion(latest.conclusion)
  return true
}

function syncFilterUI() {
  document.querySelectorAll('.hero-stat').forEach(el => el.classList.remove('active-filter'))
  const targetEl = { ok: 'stat-ok', running: 'stat-running', fail: 'stat-fail' }[activeFilter]
  if (targetEl) document.querySelector(`.hero-stat.${targetEl}`)?.classList.add('active-filter')
  document.getElementById('btn-attention')?.classList.toggle('active', activeFilter === 'attention')
  updateFilterBanner()
}

function updateSectionVisibility() {
  SECTION_GROUPS.forEach(group => {
    const shell = document.getElementById(`shell-${group.gridId}`)
    const section = document.getElementById(`section-${group.gridId}`)
    if (!shell || !section) return
    const hasVisibleCards = [...section.querySelectorAll('.card[data-card-id]')].some(card => card.style.display !== 'none')
    shell.style.display = hasVisibleCards ? 'grid' : 'none'
  })
}

function applyCardFilter() {
  document.querySelectorAll('.card[data-card-id]').forEach(card => {
    const match = cardMatchesFilter(card.dataset.cardId)
    card.style.display = activeFilter === 'attention' && !match ? 'none' : ''
    card.style.opacity = match ? '1' : '0.18'
    card.style.transition = 'opacity .2s ease'
  })
  updateSectionVisibility()
}

function clearStatusFilter() {
  activeFilter = null
  syncFilterUI()
  applyCardFilter()
}

function getSectionConfig(gridId) {
  return SECTION_GROUPS.find(group => group.gridId === gridId)
}

function updateSectionHeader(gridId, entries = null) {
  const group = getSectionConfig(gridId)
  const labelEl = document.getElementById(`label-${gridId}`)
  const section = document.getElementById(`section-${gridId}`)
  if (!group || !labelEl || !section) return
  const sourceEntries = entries || group.workflows.map((wf, i) => {
    const cardId = `${gridId}-${i}`
    return { wf, cardId, runs: CARD_RUNS[cardId] || [], index: i }
  })
  labelEl.innerHTML = renderSectionHeader(gridId, group.labelClass, group.label, sourceEntries)
}

function applySectionState(gridId) {
  const section = document.getElementById(`section-${gridId}`)
  if (!section) return
  section.style.display = SECTION_COLLAPSED[gridId] ? 'none' : 'grid'
}

function toggleSection(gridId) {
  SECTION_COLLAPSED[gridId] = !SECTION_COLLAPSED[gridId]
  applySectionState(gridId)
  updateSectionHeader(gridId)
}

function syncCardContext(cardId) {
  const wf = WF_MAP[cardId]
  const card = document.getElementById(`card-${cardId}`)
  if (!wf || !card) return
}

function toggleRunHistory(cardId) {
  RUN_HISTORY_EXPANDED[cardId] = !RUN_HISTORY_EXPANDED[cardId]
  const history = document.getElementById(`runhistory-${cardId}`)
  const btn = document.querySelector(`#runlist-${cardId} .run-toggle`)
  const timeMetaEl = document.getElementById(`timemeta-${cardId}`)
  const runs = CARD_RUNS[cardId] || []
  if (history) history.classList.toggle('is-expanded', !!RUN_HISTORY_EXPANDED[cardId])
  if (btn) {
    const remaining = Math.max(0, Math.min(runs.length, 6) - 2)
    btn.textContent = RUN_HISTORY_EXPANDED[cardId] ? '收起历史' : `展开历史 ${remaining} 条`
  }
  if (timeMetaEl && runs[0]) {
    timeMetaEl.innerHTML = renderCardTimeMeta(cardId, runs[0], isRunning(runs))
  }
}

function toggleInputPanel(cardId) {
  INPUT_PANEL_EXPANDED[cardId] = !INPUT_PANEL_EXPANDED[cardId]
  const panel = document.getElementById(`inputpanel-${cardId}`)
  const toggle = document.getElementById(`inputtoggle-${cardId}`)
  if (panel) panel.classList.toggle('is-open', !!INPUT_PANEL_EXPANDED[cardId])
  if (toggle) toggle.textContent = INPUT_PANEL_EXPANDED[cardId] ? '收起参数' : '参数'
}

async function refreshSection(gridId) {
  const group = getSectionConfig(gridId)
  if (!group) return
  await loadGroup(group.workflows, group.gridId, group.labelClass, group.label)
  updateHeroStats()
}

function getSectionAttentionTargets(gridId) {
  const group = getSectionConfig(gridId)
  if (!group) return []
  return group.workflows.map((wf, i) => {
    const cardId = `${gridId}-${i}`
    const runs = CARD_RUNS[cardId] || []
    const latest = runs[0]
    return { wf, cardId, latest }
  }).filter(item => item.latest && isFailureLikeConclusion(item.latest.conclusion))
}

function triggerSectionAttentionDeploy(gridId) {
  const group = getSectionConfig(gridId)
  if (!group) return
  const items = getSectionAttentionTargets(gridId)
  if (!items.length) {
    showToast(`${group.label} 当前没有失败项`, true)
    return
  }
  const isProd = items.some(item => resolveCardEnv(item.wf, item.cardId) === 'prod')
  const envLabel = isProd ? '包含 Prod' : 'Test'
  const services = items.map(item => `<b>${item.wf.label}</b>`).join('、')
  const body = isProd
    ? `即将对 ${group.label} 的异常项执行批量部署：${services}。<br><br>目标包含 <span class="prod-tag">生产环境</span>，请确认后再继续。`
    : `即将对 ${group.label} 的异常项执行批量部署：${services}。<br><br>将按当前卡片参数逐个触发到测试环境。`
  openConfirmModal({
    title: `${group.label} · 部署异常项`,
    body,
    isProd,
    confirmText: isProd ? '批量部署异常项' : '确认部署异常项',
    payload: {
      type: 'batch',
      label: group.label,
      items,
      serviceLabel: `${group.label} 批量部署`,
      targetEnv: envLabel,
      branch: '按卡片参数',
      workflowFile: '多工作流',
      requiresProdConfirm: isProd,
      confirmKeyword: 'PROD'
    }
  })
}

// ════════════════════════════════════════════
//  Elapsed timers
// ════════════════════════════════════════════
function formatElapsed(sec) {
  if (sec < 60) return `${sec}s`
  const m = Math.floor(sec / 60), s = sec % 60
  if (m < 60) return `${m}m ${s}s`
  const h = Math.floor(m / 60), rm = m % 60
  return `${h}h ${rm}m`
}

function startElapsedTimer(cardId, startedAt) {
  stopElapsedTimer(cardId)
  function tick() {
    const el = document.getElementById(`elapsed-${cardId}`)
    if (!el) { stopElapsedTimer(cardId); return }
    const sec = Math.floor((Date.now() - new Date(startedAt).getTime()) / 1000)
    el.textContent = `进行中 ${formatElapsed(sec)}`
  }
  tick()
  ELAPSED_TIMERS[cardId] = setInterval(tick, 1000)
}

function stopElapsedTimer(cardId) {
  if (ELAPSED_TIMERS[cardId]) {
    clearInterval(ELAPSED_TIMERS[cardId])
    delete ELAPSED_TIMERS[cardId]
  }
}

// ════════════════════════════════════════════
//  Browser notifications
// ════════════════════════════════════════════
function requestNotifyPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission()
  }
}

function sendNotify(title, body) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return
  new Notification(title, { body })
}

// ════════════════════════════════════════════
//  Render input form controls
// ════════════════════════════════════════════
function getOrderedInputEntries(inputs) {
  return Object.entries(inputs || {}).sort(([leftKey, leftCfg], [rightKey, rightCfg]) => {
    const leftIsBranch = leftKey === 'branch' || leftKey === 'ref'
    const rightIsBranch = rightKey === 'branch' || rightKey === 'ref'
    if (leftIsBranch !== rightIsBranch) return leftIsBranch ? -1 : 1

    const leftIsEnv = !!leftCfg?.envKey
    const rightIsEnv = !!rightCfg?.envKey
    if (leftIsEnv !== rightIsEnv) return leftIsEnv ? 1 : -1

    return 0
  })
}

function renderInputs(wf, cardId) {
  if (!wf.inputs || Object.keys(wf.inputs).length === 0) return ''
  let html = `<div class="input-panel" id="inputpanel-${cardId}">
    <div class="deploy-form">`
  for (const [key, cfg] of getOrderedInputEntries(wf.inputs)) {
    html += `<label>${cfg.label}</label>`
    if (cfg.type === 'select') {
      const changeAttr = ` onchange="syncCardContext('${cardId}')"`
      html += `<select id="${cardId}-${key}"${changeAttr}>`
      cfg.options.forEach(opt => {
        let selected = opt === cfg.default
        if (cfg.envKey) {
          const isProd = globalEnv === 'prod'
          selected = isProd ? opt.toLowerCase().includes('prod') : opt.toLowerCase().includes('test')
        }
        html += `<option value="${opt}"${selected ? ' selected' : ''}>${opt}</option>`
      })
      html += `</select>`
    } else {
      html += `<input type="text" id="${cardId}-${key}" value="${cfg.default}" style="width:80px" oninput="syncCardContext('${cardId}')">`
    }
  }
  html += `</div></div>`
  return html
}

//  Render run item
// ════════════════════════════════════════════
function renderRunItem(run, cardId, compact = false) {
  const title = run.display_title || run.name || '-'
  const actor = run.triggering_actor?.login || run.actor?.login || ''
  const branch = getRunBranch(run)
  const dot = statusIcon(run.status, run.conclusion)
  const actorText = actor ? (compact ? actor : `by ${actor}`) : ''
  const logLabel = compact ? '查看' : '日志'
  const wf = WF_MAP[cardId]
  const env = wf ? getRunEnvironment(run, wf, cardId) : ''
  const envBadge = env ? `<span class="run-input-badge run-env-badge run-input-${env}">${env.toUpperCase()}</span>` : ''
  return `
    <div class="run-item${compact ? ' is-compact' : ''}" data-run-id="${run.id}">
      <span class="run-status">${dot}</span>
      <div class="run-main">
        <span class="run-title" title="${title}">${title}</span>
        <div class="run-meta">
          ${branch ? `<span class="run-branch">${branch}</span>` : ''}
          ${actorText ? `<span class="run-actor">${actorText}</span>` : ''}
          <span>${badgeLabel(run.status, run.conclusion)}</span>
          ${envBadge}
        </div>
      </div>
      <span class="run-time">${timeAgo(run.created_at)}</span>
      <a class="run-link" href="${run.html_url}" target="_blank">${logLabel}</a>
    </div>`
}

function renderRunList(cardId, runs) {
  if (runs.length === 0) return `<div class="empty">暂无部署记录</div>`
  const historyRunsForList = getRunsForList(runs)
  if (historyRunsForList.length === 0) return `<div class="empty">暂无更多记录</div>`
  const expanded = !!RUN_HISTORY_EXPANDED[cardId]
  const baseRuns = historyRunsForList.slice(0, Math.min(2, historyRunsForList.length))
  const historyRuns = historyRunsForList.slice(2)
  const remaining = Math.max(0, historyRunsForList.length - 2)
  const toggleHtml = historyRunsForList.length > 2 && !isRunning(runs)
    ? `<div class="run-list-actions"><button class="run-toggle" onclick="toggleRunHistory('${cardId}')">${expanded ? '收起历史' : `展开历史 ${remaining} 条`}</button></div>`
    : ''
  const historyHtml = historyRuns.length
    ? `<div class="run-history${expanded ? ' is-expanded' : ''}" id="runhistory-${cardId}">${historyRuns.map(run => renderRunItem(run, cardId, true)).join('')}</div>`
    : ''
  return `<div class="run-primary">${baseRuns.map(run => renderRunItem(run, cardId, true)).join('')}</div>${historyHtml}${toggleHtml}`
}

// ════════════════════════════════════════════
//  Fetch runs (with in-flight deduplication)
// ════════════════════════════════════════════
async function fetchRuns(wf, cardId) {
  const key = cardId || `${wf.owner}/${wf.repo}/${wf.workflow}`
  if (IN_FLIGHT[key]) return IN_FLIGHT[key]
  const url = `https://api.github.com/repos/${wf.owner}/${wf.repo}/actions/workflows/${wf.workflow}/runs?per_page=3`
  const promise = fetch(url, { headers: headers() })
    .then(res => { if (!res.ok) throw new Error(res.status); return res.json() })
    .then(data => data.workflow_runs || [])
    .finally(() => { delete IN_FLIGHT[key] })
  IN_FLIGHT[key] = promise
  return promise
}

// ════════════════════════════════════════════
//  Fetch run detail to get inputs (workflow_dispatch params)
// ════════════════════════════════════════════
async function fetchRunInputs(wf, run) {
  const id = run.id
  if (RUN_INPUTS[id] !== undefined) return RUN_INPUTS[id]   // already cached
  RUN_INPUTS[id] = null   // mark in-flight so we don't double-fetch
  try {
    const url = `https://api.github.com/repos/${wf.owner}/${wf.repo}/actions/runs/${id}/jobs`
    const data = await fetch(url, { headers: headers() }).then(r => r.json())
    const job = (data.jobs || [])[0]
    if (job) {
      RUN_INPUTS[id] = {
        labels: job.labels || [],
        runner_name: job.runner_name || null
      }
    } else {
      RUN_INPUTS[id] = null
    }
  } catch (e) {
    RUN_INPUTS[id] = null
  }
  return RUN_INPUTS[id]
}

function renderRunInputsBadge(inputs) {
  const labels = inputs?.labels || []
  const env = labels.map(normalizeEnvValue).find(Boolean) || normalizeEnvValue(inputs?.runner_name)
  if (!env) return ''
  return `<span class="run-inputs"><span class="run-input-badge run-env-badge run-input-${env}">${env.toUpperCase()}</span></span>`
}

function hydrateRunInputsForCard(cardId, wf, runs) {
  const card = document.getElementById(`card-${cardId}`)
  const runList = document.getElementById(`runlist-${cardId}`)
  const latestRunId = runs?.[0]?.id
  runs.forEach(run => {
    fetchRunInputs(wf, run).then(inputs => {
      if (!inputs) return
      const itemEl = runList?.querySelector(`[data-run-id="${run.id}"]`)
      const metaEl = itemEl?.querySelector('.run-meta')
      if (metaEl && !metaEl.querySelector('.run-env-badge')) {
        const badges = renderRunInputsBadge(inputs)
        if (badges) metaEl.insertAdjacentHTML('beforeend', badges)
      }
      if (run.id === latestRunId) {
        const summaryEl = card?.querySelector('.execution-summary')
        const summaryBlock = renderExecutionSummary(runs[0], wf, cardId)
        if (summaryEl && summaryBlock) summaryEl.outerHTML = summaryBlock
      }
    })
  })
}


function renderCard(wf, cardId, runs, index = 0) {

  const familyMeta = getWorkflowFamilyMeta(wf)
  const bentoClass = wf.bento === '2x1' ? 'bento-2x1' : 'bento-1x1'
  const actionsUrl = `https://github.com/${wf.owner}/${wf.repo}/actions/workflows/${wf.workflow}`

  let runsHtml = ''
  runsHtml = renderRunList(cardId, runs)

  const timeMetaHtml = renderCardTimeMeta(cardId, latest, running)

  let stateClass = ''
  if (latest) {
    if (!running && latest.conclusion === 'success') stateClass = ' card-latest-success'
    else if (!running && isFailureLikeConclusion(latest.conclusion)) stateClass = ' card-latest-failure'
  }

  const dotCls = latest ? dotClass(latest.status, latest.conclusion) : 'dot-unknown'
  const disabledClass = wf.disabled ? ' card-disabled' : ''
  const deployDisabled = wf.disabled || !!CARD_DEPLOYING[cardId] || running

  return `
    <div class="${bentoClass} card card-family-${familyMeta.family}${running ? ' is-running' : ''}${stateClass}${disabledClass}" id="card-${cardId}" data-card-id="${cardId}" data-grid-id="${deriveGridId(cardId)}" data-sort-key="${getWorkflowSortKey(wf)}" ondragover="handleCardDragOver(event, '${deriveGridId(cardId)}', '${cardId}')" ondragleave="handleCardDragLeave(event, '${deriveGridId(cardId)}', '${cardId}')" ondrop="handleCardDrop(event, '${deriveGridId(cardId)}', '${cardId}')" style="animation-delay:${index * 50}ms">
      <div class="card-header">
        <div class="card-title">
          <button class="card-drag-handle" type="button" title="拖动排序" aria-label="拖动排序" draggable="true" ondragstart="handleCardDragStart(event, '${deriveGridId(cardId)}', '${cardId}')" ondragend="handleCardDragEnd('${deriveGridId(cardId)}', '${cardId}')">⋮⋮</button>
          <span class="icon"><img src="${wf.icon}" alt="" loading="lazy"></span>
          <span class="name">${wf.label}</span>
          <span class="service-kind-badge ${familyMeta.family}">${getWorkflowTypeLabel(familyMeta.family)}</span>
        </div>
        <div class="card-actions">
          <span class="status-dot ${dotCls}" id="dot-${cardId}" title="${latest ? badgeLabel(latest.status, latest.conclusion) : '无记录'}"></span>
          ${renderStatusTextBadge(latest)}
          <span class="card-time-meta" id="timemeta-${cardId}">${timeMetaHtml}</span>
          <a href="${actionsUrl}" target="_blank" class="btn-link">Actions</a>
        </div>
      </div>
      ${renderInputs(wf, cardId)}
      ${renderExecutionSummary(latest, wf, cardId)}
      ${renderFailureSummary(runs)}
      <div class="run-list" id="runlist-${cardId}">${runsHtml}</div>
      <div class="card-footer">
        <button class="btn-deploy" id="btn-${cardId}" ${deployDisabled ? 'disabled' : ''} onclick="triggerDeploy(getWf('${cardId}'), '${cardId}')">${getDeployButtonLabel(wf, cardId)}</button>
        <button class="btn-refresh" onclick="refreshCardData(getWf('${cardId}'), '${cardId}')">↺ 刷新状态</button>
        ${wf.pm2 ? `<button class="btn-log" onclick="openLogModal('${wf.pm2}', '${wf.label}')" title="查看 PM2 日志">📋 日志</button>` : ''}
      </div>
    </div>`
}

// ════════════════════════════════════════════
//  Patch card (update without full re-render)
// ════════════════════════════════════════════
function patchCard(cardId, wf, runs) {
  const prevRuns = CARD_RUNS[cardId] || []
  const wasRunning = isRunning(prevRuns)
  const nowRunning = isRunning(runs)
  if (nowRunning) RUN_HISTORY_EXPANDED[cardId] = true
  if (CARD_DEPLOYING[cardId] && (nowRunning || (runs[0]?.id && runs[0]?.id !== prevRuns[0]?.id))) {
    clearDeployState(cardId)
  }
  CARD_RUNS[cardId] = runs

  const card = document.getElementById(`card-${cardId}`)
  if (!card) return

  card.classList.remove('is-running', 'card-latest-success', 'card-latest-failure')
  if (nowRunning) card.classList.add('is-running')
  else if (runs[0]) {
    if (runs[0].conclusion === 'success') card.classList.add('card-latest-success')
    else if (isFailureLikeConclusion(runs[0].conclusion)) card.classList.add('card-latest-failure')
  }

  // Update status dot
  const dot = document.getElementById(`dot-${cardId}`)
  if (dot) {
    const latest = runs[0]
    dot.className = `status-dot ${latest ? dotClass(latest.status, latest.conclusion) : 'dot-unknown'}`
    dot.title = latest ? badgeLabel(latest.status, latest.conclusion) : '无记录'
  }

  const statusBadge = card.querySelector('.status-text-badge')
  const latest = runs[0]
  const statusHtml = renderStatusTextBadge(latest)
  if (statusBadge && statusHtml) {
    statusBadge.outerHTML = statusHtml
  } else if (!statusBadge && statusHtml) {
    const dot = card.querySelector('.status-dot')
    if (dot) dot.insertAdjacentHTML('afterend', statusHtml)
  } else if (statusBadge && !statusHtml) {
    statusBadge.remove()
  }

  // Update run list
  const runList = document.getElementById(`runlist-${cardId}`)
  if (runList) {
    runList.innerHTML = renderRunList(cardId, runs)
  }
  hydrateRunInputsForCard(cardId, wf, runs)

  // Header time meta
  const timeMetaEl = document.getElementById(`timemeta-${cardId}`)
  if (timeMetaEl) {
    timeMetaEl.innerHTML = renderCardTimeMeta(cardId, runs[0], nowRunning)
  }

  const summaryEl = card.querySelector('.execution-summary')
  const summaryBlock = renderExecutionSummary(latest, wf, cardId)
  if (summaryEl && summaryBlock) {
    summaryEl.outerHTML = summaryBlock
  } else if (!summaryEl && summaryBlock) {
    const failureNode = card.querySelector('.card-alert-summary')
    const runListNode = document.getElementById(`runlist-${cardId}`)
    ;(failureNode || runListNode)?.insertAdjacentHTML('beforebegin', summaryBlock)
  }

  const existingSummary = card.querySelector('.card-alert-summary')
  const summaryHtml = renderFailureSummary(runs)
  if (existingSummary && summaryHtml) {
    existingSummary.outerHTML = summaryHtml
  } else if (!existingSummary && summaryHtml) {
    const runList = document.getElementById(`runlist-${cardId}`)
    if (runList) runList.insertAdjacentHTML('beforebegin', summaryHtml)
  } else if (existingSummary && !summaryHtml) {
    existingSummary.remove()
  }

  // Elapsed timer
  if (nowRunning) {
    const startedAt = runs[0].run_started_at || runs[0].created_at
    startElapsedTimer(cardId, startedAt)
  } else {
    stopElapsedTimer(cardId)
    if (wasRunning && !nowRunning && runs[0]) {
      const r = runs[0]
      const success = r.conclusion === 'success'
      const wfObj = WF_MAP[cardId]
      sendNotify(
        success ? `${wfObj?.label || cardId} 部署成功` : `${wfObj?.label || cardId} 部署失败`,
        `结论：${r.conclusion}`,
      )
      showToast(success ? `${wfObj?.label || ''} 部署成功` : `${wfObj?.label || ''} 部署失败`, !success)
    }
  }

  updateHeroStats()
  // 同步按钮文字和状态
  const deployBtn = document.getElementById(`btn-${cardId}`)
  const wfForBtn = WF_MAP[cardId]
  if (deployBtn && wfForBtn) {
    updateDeployButtonState(cardId)
  }
  const gridId = deriveGridId(cardId)
  updateSectionHeader(gridId)
  reorderSectionCards(gridId)
  applyCardFilter()
  schedulePoll()
}

// ════════════════════════════════════════════
//  Refresh single card
// ════════════════════════════════════════════
async function refreshCardData(wf, cardId) {
  const btn = document.querySelector(`#card-${cardId} .btn-refresh`)
  if (btn) {
    btn.textContent = '↻ 刷新中'
    btn.style.display = 'inline-block'
    btn.style.animation = 'spin .7s linear infinite'
  }
  try {
    const runs = await fetchRuns(wf, cardId)
    patchCard(cardId, wf, runs)
  } catch (e) {
    showToast(`${wf.label} 刷新失败`, true)
  } finally {
    if (btn) {
      btn.style.animation = ''
      btn.textContent = '↺ 刷新状态'
    }
  }
}

// ════════════════════════════════════════════
//  Deploy confirm modal
// ════════════════════════════════════════════
function getConfirmMetaRows(payload) {
  if (!payload) return ''
  const rows = []
  if (payload.serviceLabel) rows.push(['服务', payload.serviceLabel])
  if (payload.targetEnv) rows.push(['环境', payload.targetEnv])
  if (payload.branch) rows.push(['分支', payload.branch])
  if (payload.workflowFile) rows.push(['Workflow', payload.workflowFile])
  if (payload.type === 'batch' && Array.isArray(payload.items)) rows.push(['范围', `${payload.items.length} 个服务`])
  if (!rows.length) return ''
  return `<div class="confirm-context">${rows.map(([label, value]) => `<div class="confirm-context-row"><span>${label}</span><span>${value}</span></div>`).join('')}</div>`
}

function getProdGuardMarkup(payload) {
  if (!payload?.requiresProdConfirm) return ''
  return `<div class="confirm-prod-guard">
    <div>生产环境部署需要二次确认。</div>
    <div>请确认服务、环境、分支和 workflow 信息无误后再继续。</div>
  </div>`
}

function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('show')
  document.getElementById('confirm-context').innerHTML = ''
  document.getElementById('confirm-extra').innerHTML = ''
  document.getElementById('confirm-error').textContent = ''
  pendingDeploy = null
}

async function doConfirmedDeploy() {
  const deploy = pendingDeploy
  if (!deploy) return
  closeConfirm()
  if (deploy.type === 'batch') {
    await executeBatchDeploy(deploy)
    return
  }
  await executeDeploy(deploy.wf, deploy.cardId)
}

function openConfirmModal({ title, body, isProd, confirmText, payload }) {
  pendingDeploy = payload

  const modal = document.getElementById('confirm-modal')
  const confirmBtn = document.getElementById('confirm-ok')
  const contextEl = document.getElementById('confirm-context')
  const extraEl = document.getElementById('confirm-extra')
  const errorEl = document.getElementById('confirm-error')
  document.getElementById('confirm-title').textContent = title
  document.getElementById('confirm-body').innerHTML = body
  if (contextEl) contextEl.innerHTML = getConfirmMetaRows(payload)
  if (extraEl) extraEl.innerHTML = getProdGuardMarkup(payload)
  if (errorEl) errorEl.textContent = ''

  confirmBtn.className = `btn-hero ${isProd ? 'btn-confirm-deploy' : 'btn-confirm-test'}`
  confirmBtn.textContent = confirmText
  confirmBtn.onclick = doConfirmedDeploy

  modal.classList.add('show')
}

function triggerDeploy(wf, cardId) {
  if (wf.disabled || CARD_DEPLOYING[cardId]) return
  const familyMeta = getWorkflowFamilyMeta(wf)

  const targetEnv = resolveCardEnv(wf, cardId)
  let isProd = targetEnv === 'prod'
  for (const [key, cfg] of Object.entries(wf.inputs || {})) {
    if (cfg.envKey) {
      const el = document.getElementById(`${cardId}-${key}`)
      if (el && el.value.toLowerCase().includes('prod')) isProd = true
    }
  }

  const inputsPayload = {}
  for (const [key] of Object.entries(wf.inputs || {})) {
    const el = document.getElementById(`${cardId}-${key}`)
    if (el) inputsPayload[key] = el.value
  }

  const paramsStr = Object.entries(inputsPayload)
    .map(([k, v]) => `<b>${k}</b>: ${v}`)
    .join(' · ')

  const familyCallout = `
    <span class="confirm-family-callout ${familyMeta.family}">
      <strong>${familyMeta.confirmLead}</strong>
      <span>${familyMeta.confirmHint}</span>
    </span>`
  openConfirmModal({
    title: isProd ? `${familyMeta.confirmTitle}（生产环境）` : familyMeta.confirmTitle,
    body: isProd
      ? `${familyCallout}即将向 <span class="prod-tag">生产环境</span> 部署 <b>${wf.label}</b>，此操作将影响线上用户。<br><br>参数：${paramsStr || '无'}`
      : `${familyCallout}即将部署 <b>${wf.label}</b> 到测试环境。<br><br>参数：${paramsStr || '无'}`,
    isProd,
    confirmText: isProd ? '部署到生产' : familyMeta.confirmTitle,
    payload: {
      type: 'single',
      wf,
      cardId,
      serviceLabel: wf.label,
      targetEnv: isProd ? 'Prod' : 'Test',
      branch: inputsPayload.ref || inputsPayload.branch || 'main',
      workflowFile: wf.workflow,
      requiresProdConfirm: isProd,
      confirmKeyword: isProd ? wf.label : ''
    }
  })
}

// ════════════════════════════════════════════
//  Execute deploy (after confirmation)
// ════════════════════════════════════════════
async function executeDeploy(wf, cardId) {
  if (CARD_DEPLOYING[cardId] === 'requesting') return
  setDeployState(cardId, 'requesting')

  const inputsPayload = {}
  for (const [key] of Object.entries(wf.inputs || {})) {
    const el = document.getElementById(`${cardId}-${key}`)
    if (el) inputsPayload[key] = el.value
  }

  try {
    const url = `https://api.github.com/repos/${wf.owner}/${wf.repo}/actions/workflows/${wf.workflow}/dispatches`
    const res = await fetch(url, {
      method: 'POST',
      headers: { ...headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: inputsPayload.ref || inputsPayload.branch || 'main', inputs: inputsPayload })
    })
    if (res.status === 204) {
      setDeployState(cardId, 'queued')
      CARD_DEPLOYING_TIMEOUTS[cardId] = setTimeout(() => {
        if (CARD_DEPLOYING[cardId] === 'queued') setDeployState(cardId, null)
      }, 45000)
      showToast(`${wf.label} 部署已触发`)
      ;[3000, 8000, 16000, 28000].forEach(delay => {
        setTimeout(() => refreshCardData(wf, cardId), delay)
      })
    } else {
      const err = await res.json().catch(() => ({}))
      setDeployState(cardId, null)
      showToast(`触发失败：${err.message || res.status}`, true)
    }
  } catch (e) {
    setDeployState(cardId, null)
    showToast(`请求失败，检查 Token`, true)
  }
}

async function executeBatchDeploy(batch) {
  let count = 0
  for (const item of batch.items) {
    await executeDeploy(item.wf, item.cardId)
    count++
  }
  showToast(`${batch.label} 已触发 ${count} 个异常项部署`)
}

// ════════════════════════════════════════════
//  Hero stats
// ════════════════════════════════════════════
function animateCount(el, target) {
  if (!el) return
  const start = parseInt(el.textContent) || 0
  if (start === target) return
  const duration = 450
  const startTime = performance.now()
  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1)
    const ease = 1 - Math.pow(1 - progress, 3) // easeOutCubic
    el.textContent = Math.round(start + (target - start) * ease)
    if (progress < 1) requestAnimationFrame(step)
    else el.textContent = target
  }
  requestAnimationFrame(step)
}

function computeMetrics() {
  const metrics = { total: 0, ok: 0, running: 0, fail: 0, off: 0 }
  Object.entries(WF_MAP).forEach(([cardId, wf]) => {
    if (wf.disabled) { metrics.off++; return }
    metrics.total++
    const runs = CARD_RUNS[cardId] || []
    const latest = runs[0]
    if (!latest) return
    if (latest.status === 'in_progress' || latest.status === 'queued') metrics.running++
    else if (isFailureLikeConclusion(latest.conclusion)) metrics.fail++
    else if (latest.conclusion === 'success') metrics.ok++
  })
  return metrics
}

function updateHeroStats() {
  const m = computeMetrics()
  const totalEl = document.getElementById('hero-total')
  const okEl = document.getElementById('hero-ok')
  const runningEl = document.getElementById('hero-running')
  const failEl = document.getElementById('hero-fail')
  const healthFill = document.getElementById('health-fill')
  const healthLabel = document.getElementById('health-label')
  const alertSlot = document.getElementById('hero-alert-slot')

  if (totalEl) animateCount(totalEl, m.total)
  if (okEl) animateCount(okEl, m.ok)
  if (runningEl) animateCount(runningEl, m.running)
  if (failEl) animateCount(failEl, m.fail)

  if (healthFill && healthLabel) {
    const healthy = m.total > 0 ? Math.round((m.ok / m.total) * 100) : 0
    healthFill.style.width = healthy + '%'
    healthLabel.textContent = healthy + '%'
    if (healthy < 50) {
      healthFill.style.background = 'linear-gradient(90deg, #FF3B30, #FF6B6B)'
      healthLabel.style.color = '#FF3B30'
    } else if (healthy < 80) {
      healthFill.style.background = 'linear-gradient(90deg, #FF9F0A, #FFD60A)'
      healthLabel.style.color = '#FF9F0A'
    } else {
      healthFill.style.background = 'linear-gradient(90deg, #34C759, #30D158)'
      healthLabel.style.color = '#34C759'
    }
  }
  if (alertSlot) {
    alertSlot.innerHTML = renderHeroAlert(m)
  }
  lastUpdateTime = Date.now()
  startRelativeTimer()
  syncFilterUI()
  applyCardFilter()
}

// ════════════════════════════════════════════
//  Relative time for last-update label
// ════════════════════════════════════════════
function startRelativeTimer() {
  clearInterval(window._relativeTimer)
  const el = document.getElementById('lastUpdate')
  function tick() {
    if (el && lastUpdateTime) {
      const sec = Math.round((Date.now() - lastUpdateTime) / 1000)
      if (sec < 10)       el.textContent = '刚刚更新'
      else if (sec < 60)  el.textContent = `${sec}s 前更新`
      else                el.textContent = `${Math.floor(sec / 60)}m 前更新`
    }

    document.querySelectorAll('.last-deploy-pill[data-relative-time]').forEach(node => {
      const deployAt = node.getAttribute('data-relative-time')
      if (!deployAt) return
      node.textContent = `最后部署 ${formatRelativeTime(deployAt)}`
      const cardId = node.id.replace('lastdeploy-', '')
      node.closest('.card-time-trigger')?.setAttribute('title', getHistoryToggleTitle(cardId, deployAt, false))
    })
  }
  tick()
  window._relativeTimer = setInterval(tick, 5000)
}

// ════════════════════════════════════════════
//  Smart polling (10s/60s)
// ════════════════════════════════════════════
function hasAnyRunning() {
  return Object.values(CARD_RUNS).some(runs => isRunning(runs))
}

function startCountdown(seconds) {
  clearInterval(countdownTimer)
  let remaining = seconds
  const el = document.getElementById('pollHint')
  function tick() {
    if (!el) { clearInterval(countdownTimer); return }
    el.textContent = `⟳ ${remaining}s`
    remaining--
    if (remaining < 0) clearInterval(countdownTimer)
  }
  tick()
  countdownTimer = setInterval(tick, 1000)
}

function schedulePoll() {
  if (pollTimer) clearTimeout(pollTimer)
  const running = hasAnyRunning()
  const delay = running ? 15000 : 60000
  startCountdown(running ? 15 : 60)
  pollTimer = setTimeout(async () => {
    if (token()) await loadAll({ silent: true })
    schedulePoll()
  }, delay)
}

// ════════════════════════════════════════════
//  Load group of workflows into grid
// ════════════════════════════════════════════
function getWf(cardId) { return WF_MAP[cardId] }

const SECTION_GROUPS = [
  { workflows: [...JAVA_WORKFLOWS, ...FE_WORKFLOWS], gridId: 'grid-java', labelClass: 'label-backend', label: 'Alano 游戏服务' },
  { workflows: [...WALLET_JAVA_WORKFLOWS, ...WALLET_FE_WORKFLOWS], gridId: 'grid-wallet-java', labelClass: 'label-wallet', label: '企业钱包服务' },
]

async function loadGroup(workflows, gridId, labelClass, labelText) {
  const root = document.getElementById('bento-root')
  let sectionContainer = document.getElementById(`section-${gridId}`)

  if (!sectionContainer) {
    const shell = document.createElement('section')
    shell.className = 'section-shell'
    shell.id = `shell-${gridId}`

    const label = document.createElement('div')
    label.className = `bento-section-label ${labelClass}`
    label.id = `label-${gridId}`
    shell.appendChild(label)

    const container = document.createElement('div')
    container.id = `section-${gridId}`
    container.className = 'section-grid'
    container.setAttribute('ondragover', `handleSectionDragOver(event, '${gridId}')`)
    container.setAttribute('ondrop', `handleSectionDrop(event, '${gridId}')`)
    shell.appendChild(container)
    root.appendChild(shell)
    sectionContainer = container
  }

  const isFirstLoad = sectionContainer.children.length === 0 ||
    (sectionContainer.children.length > 0 && !sectionContainer.querySelector('[id^="card-"]'))

  if (isFirstLoad) {
    // Skeletons
    sectionContainer.innerHTML = workflows.map(wf => {
      const bentoClass = wf.bento === '2x1' ? 'bento-2x1' : 'bento-1x1'
      return `<div class="${bentoClass} card"><div class="skeleton-card">
        <div class="skeleton w60 h20"></div>
        <div class="skeleton w80"></div>
        <div class="skeleton w40"></div>
      </div></div>`
    }).join('')
  }

  const entries = await Promise.all(workflows.map(async (wf, i) => {
    const cardId = `${gridId}-${i}`
    WF_MAP[cardId] = wf
    let runs = []
    try { runs = await fetchRuns(wf, cardId) } catch (e) {}
    return { wf, cardId, runs, index: i }
  }))

  const sortedEntries = sortWorkflowEntries(entries, gridId)
  updateSectionHeader(gridId, sortedEntries)
  applySectionState(gridId)

  if (isFirstLoad) {
    sectionContainer.innerHTML = sortedEntries.map(({ wf, cardId, runs }, idx) => {
      CARD_RUNS[cardId] = runs
      return renderCard(wf, cardId, runs, idx)
    }).join('')

    sortedEntries.forEach(({ cardId, runs }) => {
      if (isRunning(runs)) {
        const startedAt = runs[0].run_started_at || runs[0].created_at
        startElapsedTimer(cardId, startedAt)
      }
    })
    sortedEntries.forEach(({ wf, cardId, runs }) => hydrateRunInputsForCard(cardId, wf, runs))
    reorderSectionCards(gridId)
    return
  }

  sortedEntries.forEach(({ wf, cardId, runs }) => {
    const cardExists = !!document.getElementById(`card-${cardId}`)
    if (cardExists) {
      patchCard(cardId, wf, runs)
    } else {
      CARD_RUNS[cardId] = runs
      sectionContainer.insertAdjacentHTML('beforeend', renderCard(wf, cardId, runs))
      if (isRunning(runs)) {
        const startedAt = runs[0].run_started_at || runs[0].created_at
        startElapsedTimer(cardId, startedAt)
      }
      hydrateRunInputsForCard(cardId, wf, runs)
    }
  })
  reorderSectionCards(gridId)
}

// ════════════════════════════════════════════
//  Load all
// ════════════════════════════════════════════
async function loadAll(options = {}) {
  if (!token()) return
  if (GLOBAL_REFRESH_STATE.active && !options.force) return
  GLOBAL_REFRESH_STATE.active = true
  GLOBAL_REFRESH_STATE.done = 0
  GLOBAL_REFRESH_STATE.total = SECTION_GROUPS.length
  updateGlobalRefreshUI()
  const lu = document.getElementById('lastUpdate')
  if (lu) lu.textContent = '刷新中...'
  try {
    await Promise.all(SECTION_GROUPS.map(async g => {
      await loadGroup(g.workflows, g.gridId, g.labelClass, g.label)
      GLOBAL_REFRESH_STATE.done++
      updateGlobalRefreshUI()
    }))
    updateHeroStats()
  } finally {
    GLOBAL_REFRESH_STATE.active = false
    updateGlobalRefreshUI()
  }
}

// Deploy all to test
async function deployAllTest() {
  if (globalEnv !== 'test') setGlobalEnv('test')
  const enabled = Object.entries(WF_MAP).filter(([, wf]) => !wf.disabled)
  if (!enabled.length) return showToast('没有可部署的服务', true)
  let count = 0
  for (const [cardId, wf] of enabled) {
    try { await executeDeploy(wf, cardId); count++ } catch (_) {}
  }
  showToast(`已触发 ${count} 个服务部署到 Test 环境`)
}

// ════════════════════════════════════════════
//  Keyboard shortcuts
// ════════════════════════════════════════════
document.addEventListener('keydown', e => {
  const tag = e.target.tagName
  const inInput = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA'

  if (e.key === 'Escape') {
    closeConfirm()
    document.getElementById('keymap-modal')?.classList.remove('show')
    return
  }
  if (inInput) return

  if (e.key === 'r' || e.key === 'R') { loadAll(); return }
  if (e.key === '?') { document.getElementById('keymap-modal')?.classList.add('show'); return }
  if (e.key === '1') { document.getElementById('label-grid-java')?.scrollIntoView({ behavior: 'smooth' }); return }
  if (e.key === '2') { document.getElementById('label-grid-fe')?.scrollIntoView({ behavior: 'smooth' }); return }
  if (e.key === '3') { document.getElementById('label-grid-wallet-java')?.scrollIntoView({ behavior: 'smooth' }); return }
})
document.getElementById('confirm-modal')?.addEventListener('click', e => {
  if (e.target === document.getElementById('confirm-modal')) closeConfirm()
})
document.getElementById('keymap-modal')?.addEventListener('click', e => {
  if (e.target === document.getElementById('keymap-modal'))
    document.getElementById('keymap-modal').classList.remove('show')
})

// Double-click deploy (goes through confirmation modal + ripple)
document.addEventListener('dblclick', e => {
  const card = e.target.closest('.card')
  if (!card) return
  if (e.target.closest('button,input,select,a')) return
  const cardId = card.dataset.cardId
  const wf = WF_MAP[cardId]
  if (!wf || wf.disabled) return
  const ripple = document.createElement('span')
  ripple.className = 'card-ripple'
  ripple.style.cssText = `left:${e.offsetX}px;top:${e.offsetY}px`
  card.appendChild(ripple)
  setTimeout(() => ripple.remove(), 600)
  triggerDeploy(wf, cardId)
})

const LOG_BASE    = 'https://www.testgames.org/logs'
let logToken      = () => localStorage.getItem('log_token') || 'dev-log-token'
let logService    = null   // 当前打开的服务名
let logType       = 'out'  // 'out' | 'error'
let logRawLines   = []     // 原始行数组（用于复制）
let logSearchQuery = ''     // 搜索关键词
let logCaseSensitive = false // 搜索是否区分大小写
let logCurrentMatchIndex = -1 // 当前匹配项索引
let logMatchIndices = []     // 所有匹配行的索引
let logWrapEnabled = false   // 自动换行
let logCurrentLevel = 'all'   // 当前日志级别过滤
let logTailMode = false       // 实时跟踪模式
let logTailInterval = null    // 跟踪定时器
let logLastTimestamp = null   // 最后一次获取日志的时间戳（用于追加模式）
let logCurrentFontSize = 'medium' // 当前字体大小
let logCurrentTheme = 'dark'  // 当前主题
let logMarkedLines = new Set() // 已标记的行号
// ─────────────────────────────────────────────────────────────────────────────

/** 日志级别染色 */
function logLevelClass(line) {
  const u = line.toUpperCase()
  if (/\b(ERROR|EXCEPTION|SEVERE|FATAL|CRITICAL)\b/.test(u)) return 'lvl-error'
  if (/\b(WARN|WARNING)\b/.test(u))  return 'lvl-warn'
  if (/\b(DEBUG|TRACE|FINE)\b/.test(u)) return 'lvl-debug'
  return 'lvl-info'
}

/** 将日志请求异常转换为更准确的用户提示 */
function formatLogFetchError(error) {
  const message = (error && error.message) ? error.message : '未知错误'

  if (message.includes('Token 无效')) {
    return {
      summary: message,
      hint: '请在浏览器 localStorage 中设置正确的 log_token 后重试。',
      footer: '— Token 无效'
    }
  }

  if (
    message.includes('Failed to fetch') ||
    message.includes('ERR_NETWORK_CHANGED') ||
    message.includes('NetworkError')
  ) {
    return {
      summary: '浏览器网络请求失败',
      hint: `这通常不是 log-server 未启动，而是浏览器网络、代理或 CORS 配置异常。原始错误：${message}`,
      footer: '— 浏览器请求失败'
    }
  }

  if (
    message.includes('ECONNREFUSED') ||
    message.includes('ECONNRESET') ||
    message.includes('EHOSTUNREACH') ||
    message.includes('ENOTFOUND')
  ) {
    return {
      summary: '无法连接日志服务',
      hint: '请确认 log-server 已启动：pm2 start log-server.js --name log-api',
      footer: '— 日志服务不可达'
    }
  }

  return {
    summary: message,
    hint: '请检查日志服务状态、Token 配置和反向代理日志。',
    footer: '— 请求失败'
  }
}

/** 打开日志弹窗 */
async function openLogModal(serviceName, displayName) {
  logService = serviceName
  logType    = 'out'

  // 重置所有过滤状态
  logCurrentLevel = 'all'
  logSearchQuery = ''
  logCurrentMatchIndex = -1
  logMatchIndices = []

  // 重置级别按钮
  document.querySelectorAll('.log-level-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === 'all')
  })

  // 重置搜索框
  const searchInput = document.getElementById('log-search-input')
  if (searchInput) searchInput.value = ''
  const searchCount = document.getElementById('log-search-count')
  if (searchCount) searchCount.textContent = ''
  const searchWrapper = document.getElementById('log-search-wrapper')
  if (searchWrapper) searchWrapper.classList.remove('has-value')
  const searchNav = document.getElementById('log-search-nav')
  if (searchNav) searchNav.style.display = 'none'
  const searchProgress = document.getElementById('log-search-progress')
  if (searchProgress) searchProgress.classList.remove('visible')

  document.getElementById('log-tab-out').classList.add('active')
  document.getElementById('log-tab-error').classList.remove('active')
  document.getElementById('log-modal-name').textContent = displayName || serviceName

  // 设置环境标签
  const envBadge = document.getElementById('log-env-badge')
  envBadge.className = 'log-env-badge ' + (globalEnv === 'prod' ? 'prod' : 'test')
  envBadge.textContent = globalEnv === 'prod' ? 'PROD' : 'TEST'

  document.getElementById('log-modal-service').textContent = ''
  document.getElementById('log-modal').classList.add('show')
  document.body.style.overflow = 'hidden'
  await fetchLog()
}

/** 关闭日志弹窗 */
function closeLogModal() {
  document.getElementById('log-modal').classList.remove('show')
  document.body.style.overflow = ''
  logService = null
  logRawLines = []
  logSearchQuery = ''

  // 停止跟踪模式
  if (logTailMode) {
    logTailMode = false
    if (logTailInterval) {
      clearInterval(logTailInterval)
      logTailInterval = null
    }
  }

  // 重置状态
  logLastTimestamp = null
  logCurrentLevel = 'all'
  logMarkedLines.clear()
  document.querySelectorAll('.log-level-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === 'all')
  })
}

/** 滚动到顶部 */
function scrollToTop() {
  const body = document.getElementById('log-modal-body')
  if (body) {
    body.scrollTo({ top: 0, behavior: 'smooth' })
  }
}

/** 滚动到底部 */
function scrollToBottom() {
  const body = document.getElementById('log-modal-body')
  if (body) {
    body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' })
  }
}

/** 切换 stdout / stderr */
function switchLogType(type) {
  logType = type
  document.getElementById('log-tab-out').classList.toggle('active', type === 'out')
  document.getElementById('log-tab-error').classList.toggle('active', type === 'error')
  fetchLog()
}

/** 行数变化时重载 */
function reloadLog() { fetchLog(false) }

/** 拉取日志内容并渲染 */
async function fetchLog(appendMode = false) {
  if (!logService) return

  const body = document.getElementById('log-modal-body')
  const lines = document.getElementById('log-lines-select').value

  // 构建请求 URL
  let url = `${LOG_BASE}/api/logs?service=${encodeURIComponent(logService)}&type=${logType}&lines=${lines}`

  // 如果是追加模式且有最后时间戳，添加 since 参数
  if (appendMode && logLastTimestamp) {
    url += `&since=${encodeURIComponent(logLastTimestamp)}`
  }

  // 追加模式下不显示加载动画
  if (!appendMode) {
    body.innerHTML = `<div class="log-loading"><div class="log-loading-spin"></div>加载中…</div>`
  }

  try {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${logToken()}` } })
    if (res.status === 401) throw new Error('Token 无效，请在 localStorage 中设置 log_token')
    if (!res.ok) {
      const e = await res.json().catch(() => ({}))
      throw new Error(e.error || `HTTP ${res.status}`)
    }
    const data = await res.json()
    const newLines = data.lines || []

    // 调试：打印数据流
    console.log('🔍 API返回:', data.lines?.length || 0, '行')
    console.log('🔍 newLines:', newLines.length, '行')

    if (appendMode) {
      // 追加模式：将新日志添加到现有日志
      if (newLines.length > 0) {
        logRawLines = [...logRawLines, ...newLines]
        renderLogLines(logRawLines)

        // 自动滚动到底部
        const modalBody = document.getElementById('log-modal-body')
        modalBody.scrollTop = modalBody.scrollHeight
      }
    } else {
      // 普通模式：替换所有日志
      logRawLines = newLines
      console.log('🔍 赋值后 logRawLines:', logRawLines.length, '行')
      renderLogLines(logRawLines)
    }

    // 更新最后时间戳（从最后一行提取）
    if (logRawLines.length > 0) {
      const lastLine = logRawLines[logRawLines.length - 1]
      const timestamp = extractTimestamp(lastLine)
      if (timestamp) {
        // 尝试解析时间戳
        const date = new Date(timestamp)
        if (!isNaN(date.getTime())) {
          logLastTimestamp = date.toISOString()
        }
      }
    }

    // 更新页脚
    document.getElementById('log-footer-file').textContent = data.file || ''
    document.getElementById('log-footer-time').textContent =
      data.lastModified ? `最后写入 ${new Date(data.lastModified).toLocaleTimeString('zh-CN')}` : ''
    document.getElementById('log-modal-service').textContent =
      ` · ${logType === 'out' ? 'stdout' : 'stderr'} · ${logRawLines.length} 行`

  } catch (e) {
    const errorInfo = formatLogFetchError(e)
    body.innerHTML = `<div class="log-error">
      ⚠️ ${errorInfo.summary}<br>
      <small style="color:#636366;margin-top:8px;display:block">
        ${errorInfo.hint}
      </small>
    </div>`
    document.getElementById('log-footer-file').textContent = errorInfo.footer
    document.getElementById('log-footer-time').textContent = ''
  }
}

/** 从日志行中提取时间戳 */
function extractTimestamp(line) {
  // 匹配常见时间戳格式:
  // 2024-04-16 14:30:45
  // 2024-04-16T14:30:45
  // [2024-04-16 14:30:45]
  // Apr 16 14:30:45
  const patterns = [
    /^\[(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\]/,  // [2024-04-16 14:30:45]
    /^(\d{4}-\d{2}-\d{2}[T\s]\d{2}:\d{2}:\d{2})/,   // 2024-04-16 14:30:45 或 2024-04-16T14:30:45
    /^(\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})/,       // Apr 16 14:30:45
  ]
  for (const pat of patterns) {
    const m = line.match(pat)
    if (m) return m[1]
  }
  return ''
}

/** 搜索输入处理 */
function onLogSearch(value) {
  logSearchQuery = value.trim()
  logCurrentMatchIndex = -1
  logMatchIndices = []

  const wrapper = document.getElementById('log-search-wrapper')
  const navEl = document.getElementById('log-search-nav')
  const countEl = document.getElementById('log-search-count')
  const progressEl = document.getElementById('log-search-progress')
  const exportBtn = document.getElementById('log-btn-export')

  if (logSearchQuery) {
    wrapper.classList.add('has-value')
    navEl.style.display = 'flex'
    progressEl.classList.add('visible')
    if (exportBtn) exportBtn.style.display = ''
  } else {
    wrapper.classList.remove('has-value')
    navEl.style.display = 'none'
    progressEl.classList.remove('visible')
    if (exportBtn) exportBtn.style.display = 'none'
    countEl.textContent = ''
    countEl.classList.remove('has-match')
  }

  renderLogLines(logRawLines)
}

/** 清除搜索 */
function clearLogSearch() {
  document.getElementById('log-search-input').value = ''
  onLogSearch('')
  document.getElementById('log-search-input').focus()
}

/** 切换大小写敏感 */
function toggleCaseSensitive() {
  logCaseSensitive = !logCaseSensitive
  const btn = document.getElementById('log-search-case-btn')
  btn.classList.toggle('active', logCaseSensitive)
  onLogSearch(document.getElementById('log-search-input').value)
}

/** 搜索导航（上一个/下一个） */
function navigateMatch(direction) {
  if (logMatchIndices.length === 0) return

  logCurrentMatchIndex += direction
  if (logCurrentMatchIndex < 0) logCurrentMatchIndex = logMatchIndices.length - 1
  if (logCurrentMatchIndex >= logMatchIndices.length) logCurrentMatchIndex = 0

  updateCurrentMatchHighlight()
}

/** 更新当前匹配行高亮 */
function updateCurrentMatchHighlight() {
  const table = document.querySelector('.log-table')
  if (!table) return

  // 移除所有当前高亮
  table.querySelectorAll('.current-match').forEach(row => row.classList.remove('current-match'))

  // 添加当前高亮
  if (logCurrentMatchIndex >= 0 && logCurrentMatchIndex < logMatchIndices.length) {
    const rowIndex = logMatchIndices[logCurrentMatchIndex]
    const row = table.querySelector(`tr:nth-child(${rowIndex + 1})`)
    if (row) {
      row.classList.add('current-match')
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
    }

    // 更新计数显示
    const countEl = document.getElementById('log-search-count')
    countEl.textContent = `${logCurrentMatchIndex + 1}/${logMatchIndices.length}`
  }
}

/** 搜索框键盘事件 */
function onSearchKeydown(event) {
  if (event.key === 'Enter') {
    navigateMatch(event.shiftKey ? -1 : 1)
    event.preventDefault()
  }
}

/** 切换自动换行 */
function toggleWrap() {
  logWrapEnabled = document.getElementById('log-wrap-check').checked
  const body = document.getElementById('log-modal-body')
  body.querySelectorAll('.log-line-text').forEach(el => {
    el.classList.toggle('wrap-enabled', logWrapEnabled)
  })
}

/** 高亮搜索关键词 */
function highlightSearchTerm(text, query) {
  if (!query) return text
  try {
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    const flags = logCaseSensitive ? 'g' : 'gi'
    const regex = new RegExp(`(${escaped})`, flags)
    return text.replace(regex, '<span class="log-highlight">$1</span>')
  } catch (e) {
    return text
  }
}

/** 渲染日志行到表格 */
function renderLogLines(lines) {
  console.log('🔍 renderLogLines 接收到:', lines.length, '行')
  const body = document.getElementById('log-modal-body')
  if (!lines.length) {
    body.innerHTML = '<div class="log-loading" style="color:#48484a">（暂无日志）</div>'
    return
  }

  // 搜索过滤和匹配记录
  let filteredLines = lines
  logMatchIndices = []
  let matchCount = 0

  console.log('🔍 logSearchQuery:', `"${logSearchQuery}"`)
  console.log('🔍 过滤前 filteredLines:', filteredLines.length, '行')

  if (logSearchQuery) {
    const searchFn = logCaseSensitive
      ? (line) => line.includes(logSearchQuery)
      : (line) => line.toLowerCase().includes(logSearchQuery.toLowerCase())

    filteredLines = lines.filter(line => searchFn(line))

    // 记录匹配的行索引（用于导航）
    lines.forEach((line, idx) => {
      if (searchFn(line)) {
        logMatchIndices.push(idx)
      }
    })

    matchCount = filteredLines.length
  }

  // 更新搜索计数和进度条
  const countEl = document.getElementById('log-search-count')
  const progressEl = document.getElementById('log-search-progress')
  const progressFill = document.getElementById('log-progress-fill')
  const progressThumb = document.getElementById('log-progress-thumb')
  const progressText = progressEl?.querySelector('.log-progress-text')

  if (logSearchQuery) {
    if (matchCount > 0) {
      countEl.textContent = `${logCurrentMatchIndex >= 0 ? logCurrentMatchIndex + 1 + '/' : ''}${matchCount} 条匹配`
      countEl.classList.add('has-match')

      // 更新进度条
      if (progressFill && progressThumb && progressText) {
        const currentIndex = logCurrentMatchIndex >= 0 ? logCurrentMatchIndex + 1 : 0
        const percentage = matchCount > 0 ? (currentIndex / matchCount) * 100 : 0
        progressFill.style.width = `${percentage}%`
        progressThumb.style.left = `${percentage}%`
        progressText.textContent = currentIndex > 0 ? `${currentIndex}/${matchCount}` : `${matchCount}`
      }
    } else {
      countEl.textContent = '无匹配'
      countEl.classList.remove('has-match')

      // 重置进度条
      if (progressFill && progressThumb && progressText) {
        progressFill.style.width = '0%'
        progressThumb.style.left = '0%'
        progressText.textContent = '0/0'
      }
    }
  } else {
    countEl.textContent = ''
    countEl.classList.remove('has-match')

    // 隐藏进度条
    if (progressEl) {
      progressEl.classList.remove('visible')
    }
  }

  if (!filteredLines.length) {
    body.innerHTML = '<div class="log-loading" style="color:#48484a">（没有匹配的日志）</div>'
    return
  }

  const rows = filteredLines.map((line, i) => {
    const cls   = logLevelClass(line)
    const ts    = extractTimestamp(line)
    let safe   = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // 搜索高亮
    if (logSearchQuery) {
      safe = highlightSearchTerm(safe, logSearchQuery)
    }
    const wrapClass = logWrapEnabled ? 'wrap-enabled' : ''
    return `<tr>
      <td class="log-line-time">${ts}</td>
      <td class="log-line-num">${i + 1}</td>
      <td class="log-line-text ${cls} ${wrapClass}">${safe}</td>
    </tr>`
  }).join('')
  console.log('🔍 准备渲染 rows:', rows.length, '行')
  body.innerHTML = `<div class="log-table-wrapper"><table class="log-table"><tbody>${rows}</tbody></table></div>`

  // 如果有搜索且有匹配，高亮当前项
  if (logSearchQuery && logMatchIndices.length > 0 && logCurrentMatchIndex >= 0) {
    updateCurrentMatchHighlight()
  } else {
    // 自动滚到最底
    body.scrollTop = body.scrollHeight
  }

  // 添加鼠标滚轮事件监听（增强横向滚动）
  body.removeEventListener('wheel', handleWheel)
  body.addEventListener('wheel', handleWheel, { passive: false })
}

/** 处理鼠标滚轮事件 - 支持 Shift+滚轮横向滚动 */
function handleWheel(e) {
  // 如果按住 Shift 键，将垂直滚动转换为横向滚动
  if (e.shiftKey) {
    e.preventDefault()
    const body = e.currentTarget
    body.scrollLeft += e.deltaY
  }
}

/** 复制全部日志到剪贴板 */
function copyLog() {
  if (!logRawLines.length) return
  navigator.clipboard.writeText(logRawLines.join('\n'))
    .then(() => showToast('日志已复制到剪贴板'))
    .catch(() => showToast('复制失败，请手动选择', true))
}

function showDownloadMenu() {

  menu.classList.toggle('show')
}

/** 点击其他地方关闭下载菜单 */
document.addEventListener('click', e => {

/** 下载指定时间范围的日志 */
async function downloadLog(hours) {
  if (!logService) return

  const menu = document.getElementById('log-download-menu')
  const items = menu.querySelectorAll('.log-download-item')

  // 设置加载状态
  items.forEach(item => item.classList.add('log-download-loading'))

  try {
    const since = new Date(Date.now() - hours * 60 * 60 * 1000).toISOString()
    const url = `${LOG_BASE}/api/download?service=${encodeURIComponent(logService)}&type=${logType}&since=${encodeURIComponent(since)}`

    const res = await fetch(url, {
      headers: { Authorization: `Bearer ${logToken()}` }
    })

    if (res.status === 401) throw new Error('Token 无效')
    if (!res.ok) throw new Error(`HTTP ${res.status}`)

    // 获取文件名
    const contentDisposition = res.headers.get('Content-Disposition')
    let filename = `${logService}-${logType}-${hours}h.log`
    if (contentDisposition) {
      const match = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/)
      if (match && match[1]) {
        filename = match[1].replace(/['"]/g, '')
      }
    }

    // 下载文件
    const blob = await res.blob()
    const downloadUrl = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = downloadUrl
    a.download = filename
    document.body.appendChild(a)
    a.click()
    document.body.removeChild(a)
    URL.revokeObjectURL(downloadUrl)

    showToast(`已下载最近 ${hours} 小时的日志`)
  } catch (e) {
    console.error('Download failed:', e)
    showToast(`下载失败: ${e.message}`, true)
  } finally {
    // 移除加载状态
    items.forEach(item => item.classList.remove('log-download-loading'))
    menu.classList.remove('show')
  }
}

/** 按日志级别过滤 */
function filterByLevel(level) {
  logCurrentLevel = level

  // 更新按钮状态
  document.querySelectorAll('.log-level-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === level)
  })

  // 更新统计显示
  updateLevelStats()

  // 重新渲染
  renderLogLines(logRawLines)
}

/** 更新级别统计 */
function updateLevelStats() {
  if (!logRawLines.length) return

  const stats = { error: 0, warn: 0, info: 0, debug: 0, total: logRawLines.length }
  logRawLines.forEach(line => {
    const cls = logLevelClass(line)
    if (cls === 'lvl-error') stats.error++
    else if (cls === 'lvl-warn') stats.warn++
    else if (cls === 'lvl-info') stats.info++
    else if (cls === 'lvl-debug') stats.debug++
  })

  const countEl = document.getElementById('log-level-count')
  if (countEl) {
    countEl.textContent = `(E:${stats.error} W:${stats.warn} I:${stats.info} D:${stats.debug})`
  }
}

// ════════════════════════════════════════════════════════════════════════════════
//  新增功能：实时跟踪模式（追加方式）
// ════════════════════════════════════════════════════════════════════════════════
/** 切换实时跟踪模式 */
async function toggleTailMode() {
  logTailMode = !logTailMode
  const btn = document.getElementById('log-btn-tail')
  const icon = btn.querySelector('.btn-icon')

  if (logTailMode) {
    btn.classList.add('active')
    if (icon) icon.textContent = '⏸'
    btn.innerHTML = '⏸ 跟踪中'
    showToast('实时跟踪已开启（追加模式）')

    // 立即加载一次（非追加模式，获取初始数据）
    logLastTimestamp = null
    await fetchLog(false)

    // 定时刷新（追加模式）
    logTailInterval = setInterval(async () => {
      if (logService) {
        await fetchLog(true) // 使用追加模式
      }
    }, 2000) // 每2秒刷新
  } else {
    btn.classList.remove('active')
    btn.innerHTML = '▶ 跟踪'
    showToast('实时跟踪已停止')

    if (logTailInterval) {
      clearInterval(logTailInterval)
      logTailInterval = null
    }

    // 清除时间戳，下次重新加载
    logLastTimestamp = null
  }
}

// ════════════════════════════════════════════════════════════════════════════════
//  新增功能：导出搜索结果
// ════════════════════════════════════════════════════════════════════════════════
/** 导出搜索匹配的行 */
function exportMatches() {
  if (!logSearchQuery) {
    showToast('请先输入搜索关键词', true)
    return
  }

  if (logMatchIndices.length === 0) {
    showToast('没有匹配的结果', true)
    return
  }

  const matchedLines = logMatchIndices.map(idx => logRawLines[idx])
  const content = matchedLines.join('\n')
  const filename = `${logService}-${logType}-search-${logSearchQuery.replace(/[^\w]/g, '_')}.log`

  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = filename
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
  URL.revokeObjectURL(url)

  showToast(`已导出 ${logMatchIndices.length} 条匹配结果`)
}

// ════════════════════════════════════════════════════════════════════════════════
//  新增功能：字体大小循环切换
// ════════════════════════════════════════════════════════════════════════════════
/** 循环切换字体大小 */
function cycleFontSize() {
  const sizes = ['small', 'medium', 'large', 'xlarge']
  const labels = { small: '10px', medium: '12px', large: '14px', xlarge: '16px' }

  const currentIndex = sizes.indexOf(logCurrentFontSize)
  const nextIndex = (currentIndex + 1) % sizes.length
  logCurrentFontSize = sizes[nextIndex]

  const modalBox = document.querySelector('.log-modal-box')
  modalBox.classList.remove('font-small', 'font-medium', 'font-large', 'font-xlarge')
  modalBox.classList.add(`font-${logCurrentFontSize}`)

  const btn = document.querySelector('.log-btn-font')
  if (btn) btn.textContent = `A${labels[logCurrentFontSize]}`

  showToast(`字体大小: ${labels[logCurrentFontSize]}`)
}

//  新增功能：主题切换
