/** 切换主题 */
function toggleTheme() {
  const modalBox = document.querySelector('.log-modal-box')
  logCurrentTheme = logCurrentTheme === 'dark' ? 'light' : 'dark'

  if (logCurrentTheme === 'light') {
    modalBox.classList.add('theme-light')
  } else {
    modalBox.classList.remove('theme-light')
  }
  showToast(logCurrentTheme === 'dark' ? '已切换到深色主题' : '已切换到浅色主题')
}

// ════════════════════════════════════════════════════════════════════════════════
//  新增功能：时间跳转
// ════════════════════════════════════════════════════════════════════════════════
/** 跳转到指定时间 */
function jumpToTime() {
  const input = document.getElementById('log-time-jump')
  const targetTime = input.value

  if (!targetTime) {
    showToast('请输入时间', true)
    return
  }

  const targetDate = new Date(targetTime)
  if (isNaN(targetDate.getTime())) {
    showToast('时间格式无效', true)
    return
  }

  const body = document.getElementById('log-modal-body')
  const table = document.querySelector('.log-table')
  if (!table) return

  const rows = table.querySelectorAll('tr')
  let targetRow = null

  for (let i = 0; i < rows.length; i++) {
    const timeCell = rows[i].querySelector('.log-line-time')
    if (timeCell) {
      const rowTime = new Date(timeCell.textContent)
      if (!isNaN(rowTime.getTime()) && rowTime >= targetDate) {
        targetRow = rows[i]
        break
      }
    }
  }

  if (targetRow) {
    targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' })
    targetRow.classList.add('current-match')
    setTimeout(() => targetRow.classList.remove('current-match'), 2000)
    showToast('已跳转到指定时间')
  } else {
    showToast('未找到指定时间的日志', true)
  }
}

// ════════════════════════════════════════════════════════════════════════════════
//  新增功能：更新日志统计
// ════════════════════════════════════════════════════════════════════════════════
/** 更新日志统计信息 */
function updateLogStats() {
  if (!logRawLines.length) return

  const stats = {
    total: logRawLines.length,
    error: 0,
    warn: 0,
    info: 0,
    debug: 0,
    marked: logMarkedLines.size
  }

  logRawLines.forEach((line, idx) => {
    const cls = logLevelClass(line)
    if (cls === 'lvl-error') stats.error++
    else if (cls === 'lvl-warn') stats.warn++
    else if (cls === 'lvl-info') stats.info++
    else if (cls === 'lvl-debug') stats.debug++
  })

  const statsEl = document.getElementById('log-footer-stats')
  if (statsEl) {
    statsEl.innerHTML = `
      <span class="stat-item">总计: ${stats.total}</span>
      <span class="stat-item" style="color:#FF6B6B">E:${stats.error}</span>
      <span class="stat-item" style="color:#FFD60A">W:${stats.warn}</span>
      <span class="stat-item" style="color:#0A84FF">I:${stats.info}</span>
      <span class="stat-item" style="color:#8e8e93">D:${stats.debug}</span>
      ${stats.marked > 0 ? `<span class="stat-item" style="color:#AF52DE">标记: ${stats.marked}</span>` : ''}
    `
  }
}

// ════════════════════════════════════════════════════════════════════════════════
//  新增功能：标记行
// ════════════════════════════════════════════════════════════════════════════════
/** 标记/取消标记行 */
function markLine(lineNum) {
  const table = document.querySelector('.log-table')
  if (!table) return

  const row = table.querySelector(`tr:nth-child(${lineNum})`)
  if (!row) return

  if (logMarkedLines.has(lineNum)) {
    logMarkedLines.delete(lineNum)
    row.classList.remove('marked')
  } else {
    logMarkedLines.add(lineNum)
    row.classList.add('marked')
  }

  updateLogStats()
}

/** 点击行号标记 */
document.addEventListener('click', e => {
  if (e.target.classList.contains('log-line-num')) {
    const row = e.target.closest('tr')
    if (row) {
      const lineNum = Array.from(row.parentNode.children).indexOf(row) + 1
      markLine(lineNum)
    }
  }
})

/** 点击日志文本复制行 */
document.addEventListener('click', async e => {
  if (e.target.classList.contains('log-line-text')) {
    const text = e.target.textContent
    try {
      await navigator.clipboard.writeText(text)
      showToast('已复制行内容')
    } catch {
      showToast('复制失败', true)
    }
  }
})

const originalCloseLogModal = closeLogModal
closeLogModal = function() {
  // 停止跟踪模式
  if (logTailMode) {
    toggleTailMode()
  }

  // 清理状态
  logCurrentLevel = 'all'
  logMarkedLines.clear()
  document.querySelectorAll('.log-level-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.level === 'all')
  })

  // 调用原始关闭函数
  originalCloseLogModal()
}

// ════════════════════════════════════════════════════════════════════════════════
//  增强：在fetchLog后更新统计
// ════════════════════════════════════════════════════════════════════════════════
const originalFetchLog = fetchLog
fetchLog = async function() {
  await originalFetchLog()
  updateLevelStats()
  updateLogStats()
}

// ════════════════════════════════════════════════════════════════════════════════
//  增强：renderLogLines 支持级别过滤
// ════════════════════════════════════════════════════════════════════════════════
const originalRenderLogLines = renderLogLines
renderLogLines = function(lines) {
  // 先按级别过滤
  let filteredLines = lines
  if (logCurrentLevel !== 'all') {
    filteredLines = lines.filter(line => {
      const cls = logLevelClass(line)
      if (logCurrentLevel === 'error') return cls === 'lvl-error'
      if (logCurrentLevel === 'warn') return cls === 'lvl-warn'
      if (logCurrentLevel === 'info') return cls === 'lvl-info'
      if (logCurrentLevel === 'debug') return cls === 'lvl-debug'
      return true
    })
  }

  // 调用原始渲染函数
  originalRenderLogLines(filteredLines)
}

/** 加载日志服务列表，渲染到 logs-grid */
async function loadLogServices() {
  const grid = document.getElementById('logs-grid')
  if (!grid) return

  try {
    const res = await fetch(`${LOG_BASE}/api/services`, {
      headers: { Authorization: `Bearer ${logToken()}` }
    })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const data = await res.json()
    const services = data.services || []

    if (!services.length) {
      grid.innerHTML = `<div class="log-setup-card bento-hero">
        <div class="log-setup-icon">🗂️</div>
        <div class="log-setup-body">
          <h4>暂无日志文件</h4>
          <p>在 <code>${data.logsDir || '~/.pm2/logs'}</code> 目录中未找到 PM2 日志文件。<br>
          确认服务已启动：<code>pm2 list</code></p>
        </div>
      </div>`
      return
    }

    grid.innerHTML = services.map(svc => {
      const badges = [
        svc.hasOut   ? '<span class="log-badge log-badge-out">stdout</span>'   : '',
        svc.hasError ? '<span class="log-badge log-badge-error">stderr</span>' : '',
      ].join('')
      return `
      <div class="bento-1x1 log-card" onclick="openLogModal('${svc.name}')">
        <div class="log-card-header">
          <div class="log-card-icon">📄</div>
          <span class="log-card-name">${svc.name}</span>
        </div>
        <div class="log-card-badges">${badges}</div>
        <div class="log-card-hint">点击查看日志</div>
      </div>`
    }).join('')
  } catch (e) {
    grid.innerHTML = `<div class="log-setup-card bento-hero">
      <div class="log-setup-icon">🚀</div>
      <div class="log-setup-body">
        <h4>log-server 未启动</h4>
        <p>请在与 dashboard 同目录执行：<br>
        <code>pm2 start log-server.js --name log-api</code><br>
        Token 默认为 <code>dev-log-token</code>，可通过环境变量 <code>LOG_TOKEN</code> 修改。</p>
      </div>
    </div>`
  }
}

// Esc 关闭日志弹窗
document.addEventListener('keydown', e => {
  const logModal = document.getElementById('log-modal')
  const isLogOpen = logModal && logModal.classList.contains('show')

  // 日志弹窗快捷键
  if (isLogOpen) {
    // ESC - 关闭弹窗
    if (e.key === 'Escape') {
      closeLogModal()
      return
    }

    // Ctrl+F 或 / - 聚焦搜索框
    if ((e.key === 'f' && (e.ctrlKey || e.metaKey)) || e.key === '/') {
      e.preventDefault()
      document.getElementById('log-search-input').focus()
      document.getElementById('log-search-input').select()
      return
    }

    // F3 或 Ctrl+G - 下一个匹配
    if (e.key === 'F3' || (e.key === 'g' && (e.ctrlKey || e.metaKey))) {
      e.preventDefault()
      navigateMatch(1)
      return
    }

    // Shift+F3 或 Ctrl+Shift+G - 上一个匹配
    if ((e.shiftKey && e.key === 'F3') || (e.key === 'g' && e.ctrlKey && e.shiftKey)) {
      e.preventDefault()
      navigateMatch(-1)
      return
    }

    // Ctrl+C - 复制全部日志
    if (e.key === 'c' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault()
      copyLog()
      return
    }

    // Home - 跳到顶部
    if (e.key === 'Home') {
      const body = document.getElementById('log-modal-body')
      body.scrollTop = 0
      return
    }

    // End - 跳到底部
    if (e.key === 'End') {
      const body = document.getElementById('log-modal-body')
      body.scrollTop = body.scrollHeight
      return
    }

    // F5 - 刷新
    if (e.key === 'F5') {
      e.preventDefault()
      reloadLog()
      return
    }
  }
})
